name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Keep the running main check intact so deployment can wait for its result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and typecheck
        run: npm run build

      - name: Test game rules and room lifecycle
        run: npm test

      - name: Install Chromium and browser dependencies
        run: npx playwright install --with-deps chromium

      - name: Test browser interactions and responsive layouts
        run: npm run test:e2e

      - name: Collect layout screenshots
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          mkdir -p test-results/screenshots
          shopt -s nullglob
          for screenshot in /tmp/uno-*.png; do
            cp "$screenshot" test-results/screenshots/
          done

      - name: Upload browser report and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-results-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
